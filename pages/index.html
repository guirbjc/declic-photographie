<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Déclic Photographie</title>
  <link rel="icon" href="../assets/images/Dé.png" type="image/x-icon">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap" rel="stylesheet">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <header>
    <h1>Déclic Photographie</h1>
  </header>

  <main>
    <div class="model-container">
      <model-viewer
        id="camera-model"
        src="../assets/models/appareil-photo-3D.glb"
        alt="Modèle 3D d'un appareil photo"
        ar
        auto-rotate
        camera-controls
        shadow-intensity="0.5"
        exposure="0.7"
      ></model-viewer>

      <!-- Bulles circulaires à gauche -->
      <div class="info-bubbles left">
        <div class="info-bubble-circle" data-target="lens-info">
          <span class="bubble-icon">◯</span>
        </div>
        <div class="info-bubble-circle" data-target="sensor-info">
          <span class="bubble-icon">▷</span>
        </div>
        <div class="info-bubble-circle" data-target="diaphragm-info">
          <span class="bubble-icon">◎</span>
        </div>
      </div>

      <!-- Bulles circulaires à droite -->
      <div class="info-bubbles right">
        <div class="info-bubble-circle" data-target="iso-info">
          <span class="bubble-icon">◇</span>
        </div>
        <div class="info-bubble-circle" data-target="focus-info">
          <span class="bubble-icon">¤</span>
        </div>
        <div class="info-bubble-circle" data-target="shutter-info">
          <span class="bubble-icon">~</span>
        </div>
      </div>

      <!-- Cadre central pour les infos avec la nouvelle structure -->
      <div id="info-panel" class="info-panel">
        <div class="info-content">
          <div class="info-title-container">
            <h3 id="info-title">Titre</h3>
          </div>
          <div class="info-text-container-scrollable">
            <div id="info-text">Contenu informatif...</div>
          </div>
          <div class="info-image-container">
            <img id="info-image" src="" alt="Schéma">
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 - Guilhem Rebéjac</p>
  </footer>

  <script src="../js/script.js" defer></script>
</body>
</html>
